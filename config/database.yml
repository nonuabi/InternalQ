default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: internalq_development

test:
  <<: *default
  database: internalq_test

production:
  <<: *default
  database: <%= ENV["INTERNALQ_DATABASE_NAME"] %>
  username: <%= ENV["INTERNALQ_DATABASE_USERNAME"] %>
  password: <%= ENV["INTERNALQ_DATABASE_PASSWORD"] %>
  host: <%= ENV["INTERNALQ_DATABASE_HOST"]%>
  port: 5432
