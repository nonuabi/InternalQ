default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: knowledge_vault_development

test:
  <<: *default
  database: knowledge_vault_test

production:
  primary: &primary_production
    <<: *default
    database: knowledge_vault_production
    username: knowledge_vault
    password: <%= ENV["KNOWLEDGE_VAULT_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: knowledge_vault_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: knowledge_vault_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: knowledge_vault_production_cable
    migrations_paths: db/cable_migrate
